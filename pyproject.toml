[project]
name = "sop-rca"
version = "0.1.0"
description = "SOP-grounded telecom incident-triage agent PoC"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "boto3>=1.35",
    "botocore[crt]>=1.35",
    "pydantic>=2.0,<3",
    "strands-agents==1.57.2",
    "bedrock-agentcore==1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
]

[tool.uv]
package = false   # a set of top-level packages (store/, harness/, ...), not an installable wheel

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
